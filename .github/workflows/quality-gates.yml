# Generated from xynes-infra scripts/setup/ci-quality-profiles.json.
name: "Required quality gates"
"on":
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
  workflow_dispatch: {}
permissions:
  contents: "read"
concurrency:
  group: "quality-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  gates:
    name: "${{ matrix.gate }}"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        gate:
          - "lint"
          - "test"
          - "coverage"
          - "build"
          - "typecheck"
    env:
      GATE_NAME: "${{ matrix.gate }}"
    steps:
      -
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
        with:
          persist-credentials: false
      -
        uses: "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6"
        with:
          bun-version: "1.4.2"
      -
        uses: "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020"
        with:
          node-version: "22.22.0"
      -
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
        with:
          persist-credentials: false
          path: "ci-type-tools"
          repository: "Xynes-Studio/xynes-platform-contracts"
          ref: "141e32a21deccfbb6711c2cbc770bffaf983b791"
        if: "matrix.gate == 'typecheck'"
      -
        uses: "pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1"
        with:
          version: "10.33.0"
        if: "matrix.gate == 'typecheck'"
      -
        run: "pnpm install --frozen-lockfile"
        working-directory: "ci-type-tools"
        if: "matrix.gate == 'typecheck'"
      -
        run: |
          case "$GATE_NAME" in
            lint)
              python3 .github/ci/docs-check.py
              ;;
            test)
              PYTHONDONTWRITEBYTECODE=1 python3 .github/ci/docs-check.test.py
              ;;
            coverage)
              PYTHONDONTWRITEBYTECODE=1 python3 .github/ci/docs-check.test.py --coverage
              ;;
            build)
              python3 .github/ci/docs-check.py --manifest > /dev/null
              ;;
            typecheck)
              ci-type-tools/node_modules/.bin/tsc --strict --noEmit --target ES2022 --module ESNext --moduleResolution bundler --types node --typeRoots ci-type-tools/node_modules/@types .github/ci/ci-policy.ts .github/ci/release-gates.ts
              ;;
            *) exit 2 ;;
          esac
